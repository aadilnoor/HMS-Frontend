<div class="container">
  <hr />
  <h2
    style="text-align: center; margin-top: 20px; animation: fadeIn 2s ease-out"
  >
    Total Appointments
  </h2>
  <hr />
  <!-- Table -->
  <div class="table-container">
    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Disease</th>
          <th>Number</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let appointment of appointments">
          <td>{{ appointment.id }}</td>
          <td>{{ appointment.name }}</td>
          <td>{{ appointment.age }}</td>
          <td>{{ appointment.symtomps }}</td>
          <td>{{ appointment.number }}</td>
          <td>
            <button (click)="delete(appointment.id)" class="btn btn-danger">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
