<div class="container">
  <hr />
  <h2
    style="text-align: center; margin-top: 20px; animation: fadeIn 2s ease-out"
  >
    Doctor Dashboard
  </h2>
  <hr />
  <div class="tableFixHead">
    <!-- Table -->
    <div class="table-container">
      <table class="styled-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Blood Group</th>
            <th>Urgency</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let patient of patients">
            <td>{{ patient.id }}</td>
            <td>{{ patient.name }}</td>
            <td>{{ patient.age }}</td>
            <td>{{ patient.blood }}</td>
            <td>{{ patient.urgency }}</td>
            <td>
              <button (click)="update(patient.id)" class="btn btn-success">
                Update
              </button>

              <button
                (click)="delete(patient.id)"
                class="btn btn-danger"
                style="margin: 20px"
              >
                Delete
              </button>
              <button
                (click)="view(patient.id)"
                class="btn btn-primary"
                style="margin: 0px"
              >
                View
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
