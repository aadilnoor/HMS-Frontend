<div class="container">
  <hr />
  <h2
    style="text-align: center; margin-top: 20px; animation: fadeIn 2s ease-out"
  >
    Medicine List
  </h2>
  <hr />
  <div class="tableFixHead">
    <!-- Table -->
    <div class="table-container">
      <table class="styled-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Medicine Name</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let medicine of medicines">
            <td>{{ medicine.id }}</td>
            <td>{{ medicine.medName }}</td>
            <td>{{ medicine.stock }}</td>
            <td>
              <button
                type="submit"
                (click)="delete(medicine.id)"
                class="btn btn-danger" style="margin: 10px;"
              >
                Delete
              </button>

              <button
                type="submit"
                (click)="update(medicine.id)"
                class="btn btn-success"
              >
                Update
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
