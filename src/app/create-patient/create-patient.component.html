  <!-- Form -->
  <div class="container" style="margin-top: 40px;">
    <h1 class="text-center">Add New Patient</h1>
  
    <form (ngSubmit)="onSubmit()">

      <!-- Name -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          class="form-control animated-input"
          placeholder="Enter Name"
          name="name"
          [(ngModel)]="patient.name"
        />
      </div>
  
      <!-- Age -->
      <div class="form-group">
        <label for="age">Age:</label>
        <input
          type="text"
          id="age"
          class="form-control animated-input"
          placeholder="Enter Age"
          name="age"
          [(ngModel)]="patient.age"
        />
      </div>
  
      <!-- Blood Group -->
      <div class="form-group">
        <label for="blood">Blood Group:</label>
        <input
          type="text"
          id="blood"
          class="form-control animated-input"
          placeholder="Enter Blood Group"
          name="blood"
          [(ngModel)]="patient.blood"
        />
      </div>
  
      <!-- Prescription -->
      <div class="form-group">
        <label for="prescription">Prescription:</label>
        <input
          type="text"
          id="prescription"
          class="form-control animated-input"
          placeholder="Enter Prescription"
          name="prescription"
          [(ngModel)]="patient.prescription"
        />
      </div>
  
      <!-- Dose -->
      <div class="form-group">
        <label for="dose">Dose:</label>
        <input
          type="text"
          id="dose"
          class="form-control animated-input"
          placeholder="Enter Dose"
          name="dose"
          [(ngModel)]="patient.dose"
        />
      </div>
  
      <!-- Fees -->
      <div class="form-group">
        <label for="fees">Fees:</label>
        <input
          type="text"
          id="fees"
          class="form-control animated-input"
          placeholder="Enter Fees"
          name="fees"
          [(ngModel)]="patient.fees"
        />
      </div>
  
      <!-- Urgency Level -->
      <div class="form-group">
        <label for="urgency">Urgency Level:</label>
        <input
          type="text"
          id="urgency"
          class="form-control animated-input"
          placeholder="Enter Urgency Level"
          name="urgency"
          [(ngModel)]="patient.urgency"
        />
      </div>
  
      <!-- Submit Button -->
      <button type="submit" class="btn btn-success animated-button">
        Submit
      </button>
    </form>
  </div>
