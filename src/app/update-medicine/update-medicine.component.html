<!-- Form -->
<div class="container mt-5">
  <h1 class="text-center page-title">Update Medicine</h1>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="medName">Medicine Name:</label>
      <input
        type="text"
        id="medName"
        class="form-control animated-input"
        placeholder="Enter Medicine Name"
        name="medName"
        [(ngModel)]="medicine.medName"
      />
    </div>

    <div class="form-group">
      <label for="stock">Stock:</label>
      <input
        type="text"
        id="stock"
        class="form-control animated-input"
        placeholder="Enter Stock"
        name="stock"
        [(ngModel)]="medicine.stock"
      />
    </div>

    <button type="submit" class="btn btn-success animated-button">
      Submit
    </button>
  </form>
</div>
